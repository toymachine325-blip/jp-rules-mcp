# -------------------------------------------------------------
# Render.com Blueprint for Souon AI Micro Store & JP Rules MCP
# -------------------------------------------------------------
services:
  - type: web
    name: jp-rules-mcp
    runtime: node
    plan: free
    region: oregon
    rootDir: ai_micro_store
    buildCommand: "echo 'Zero dependencies: ready to run'"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3456
      - key: JP_RULES_ONLY
        value: "true"
      - key: JP_RULES_FREE_BETA
        value: "true"
      # 利用状況 (GET /api/stats) を見るための合言葉。未設定なら /api/stats は無効（404）
      - key: STATS_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
